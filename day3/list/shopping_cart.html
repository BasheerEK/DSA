<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            font-size: 24px;
        }

        .clear-btn {
            background: #e74c3c;
            padding: 8px 15px;
            font-size: 14px;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .cart-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .cart-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .cart-item:hover {
            transform: translateX(5px);
        }

        .item-name {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .remove-btn {
            background: #e74c3c;
            padding: 6px 12px;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .empty-message {
            text-align: center;
            color: #999;
            font-size: 18px;
            padding: 40px 0;
        }

        .total-section {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .total-count {
            font-size: 32px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Shopping Cart</h1>
        
        <div class="add-section">
            <input type="text" id="itemInput" placeholder="Enter item name..." onkeypress="handleEnter(event)">
            <button onclick="addItem()">Add Item</button>
        </div>

        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="clear-btn" onclick="clearCart()">Clear All</button>
        </div>

        <ul class="cart-list" id="cartList">
            <p class="empty-message">Your cart is empty!</p>
        </ul>

        <div class="total-section">
            <div>Total Items</div>
            <div class="total-count" id="totalCount">0</div>
        </div>
    </div>

    <script>
        let cart = [];

        function addItem() {
            const input = document.getElementById('itemInput');
            const itemName = input.value.trim();
            
            if (itemName === '') {
                alert('Please enter an item name!');
                return;
            }
            
            cart.push(itemName);
            input.value = '';
            input.focus();
            updateCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function clearCart() {
            if (cart.length === 0) {
                alert('Cart is already empty!');
                return;
            }
            
            if (confirm('Are you sure you want to clear the entire cart?')) {
                cart = [];
                updateCart();
            }
        }

        function updateCart() {
            const cartList = document.getElementById('cartList');
            const totalCount = document.getElementById('totalCount');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-message">Your cart is empty!</p>';
            } else {
                cartList.innerHTML = cart.map((item, index) => `
                    <li class="cart-item">
                        <span class="item-name">${item}</span>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </li>
                `).join('');
            }
            
            totalCount.textContent = cart.length;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                addItem();
            }
        }

        // Initialize
        updateCart();
    </script>
</body>
</html>
